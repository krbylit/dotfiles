# Use fish as the default shell if available (works on macOS and Linux)
if-shell 'command -v fish' 'set -g default-shell #(command -v fish)'

# Change prefix from Ctrl-b to Ctrl-g (like Zellij)
# unbind C-b
set -g prefix C-g
bind C-g send-prefix
unbind C-b

# List of plugins
# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'alexwforsythe/tmux-which-key'
# set -g @plugin 'catppuccin/tmux#v2.1.2'

# [https://github.com/catppuccin/tmux](Catppuccin config)
# set -g @catppuccin_flavor 'macchiato' # latte, frappe, macchiato or mocha

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Start window/pane numbering at 1 (human indexing)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows
set -g renumber-windows on

# Faster key response
set -s escape-time 10

# Increase scrollback
set -g history-limit 100000

# Open new panes/windows in current path
bind c new-window -c "#{pane_current_path}"

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -g set-clipboard on
set -g mode-keys vi

# bind-key , display-menu \
#  "New Window" c "new-window -c '#{pane_current_path}'" \
#  "Split Vertical" v "split-window -h -c '#{pane_current_path}'" \
#  "Split Horizontal" s "split-window -v -c '#{pane_current_path}'" \
#  "Kill Pane" x "kill-pane" \
#  "Reload Config" r "source-file ~/.tmux.conf" \
#  "List Sessions" S "choose-tree -Zs"

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send -X rectangle-toggle


bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# easier pane killing
bind x kill-pane

# easier window killing
bind X kill-window

# kill session
bind-key K confirm-before -p "kill session #S? (y/n)" "kill-session"

# clear screen
bind C-l send-keys C-l

# synchronize panes toggle
bind S setw synchronize-panes

bind e choose-tree -Zs

# fzf session switch (bypasses tmux-fzf menus)
bind s run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# tmux-which-key configuration
# Press prefix (Ctrl-b) then ? to show keybindings
# set -g @tmux-which-key-xdg-enable 1

set -g @which-key-timeout 500
set -g @which-key-position 'center'

# Zellij-inspired keybindings
# Alt+h/l to switch windows, Alt+j/k to move between panes
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Alt+arrow keys also work
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# Alt+n to create new pane (like Zellij)
bind -n M-n split-window -h -c "#{pane_current_path}"

# Easier pane splitting (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

set -g pane-border-status off
set -g pane-active-border-style fg=#c6a0f6
set -g pane-border-style fg=#494d64

# So Gas Town agents don't continually rename panes
# set -g allow-rename off

# Configure the catppuccin plugin
# set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
# Make sure you load the catppuccin theme prior to setting the status-left and/or status-left options. This ensures the catppuccin options (such as colors and status modules) are defined so they can then be used.
# After status-left and/or status-left have been set, make sure to run TPM to load the modules. This runs any plugins that may replace text in the status line.
# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux


# Some basic mocha colors (for reference)
# set -g @ctp_bg "#24273a"
# set -g @ctp_surface_1 "#494d64"
# set -g @ctp_fg "#cad3f5"
# set -g @ctp_mauve "#c6a0f6"
# set -g @ctp_crust "#181926"

# # status line (using direct colors instead of variable interpolation for compatibility)
set -g status-style "bg=#24273a,fg=#cad3f5"
#
# message style (for prompts like "kill-pane? (y/n)")
set -g message-style "bg=#c6a0f6,fg=#181926"
set -g message-command-style "bg=#c6a0f6,fg=#181926"
#
# windows (using direct colors instead of variable interpolation for compatibility)
# Use #W for window name (shows current command with automatic-rename)
set -g window-status-format "#[bg=#494d64,fg=#cad3f5] #I #W #F"
set -g window-status-current-format "#[bg=#c6a0f6,fg=#181926] #I #W #F"

# Automatically rename windows to reflect current command
set -g automatic-rename on

# # Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# set -ag status-right "#{E:@catppuccin_status_user}"
# set -ag status-right "#{E:@catppuccin_status_host}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# # set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"

# Gas Town: auto-theme sessions by name on creation
set-hook -g session-created "run-shell '~/.config/tmux/tmux-theme-session.sh #{session_name}'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
unbind -T prefix Space
bind-key -T prefix , show-wk-menu-root
