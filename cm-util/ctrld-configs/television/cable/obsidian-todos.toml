[metadata]
name = "obsidian-todos"
description = "Search and manage Obsidian todo items from todos.md and today's daily note"
requirements = ["rg", "bat", "sed"]

[source]
# Multi-source: cycles through Pending, All, and Done todos (use ctrl-s or ctrl-h to toggle)
command = [
  "sh -c 'rg -n --color=always \"^\\s*- \\[ \\]\" \"$OBSIDIAN_TODOS_FILE\" \"$OBSIDIAN_DAILY_NOTES_PATH/$(date +%Y-%m-%d).md\" 2>/dev/null | tail -r'",
  "sh -c 'rg -n --color=always \"^\\s*- \\[\" \"$OBSIDIAN_TODOS_FILE\" \"$OBSIDIAN_DAILY_NOTES_PATH/$(date +%Y-%m-%d).md\" 2>/dev/null | tail -r'",
  "sh -c 'rg -n --color=always \"^\\s*- \\[x\\]\" \"$OBSIDIAN_TODOS_FILE\" \"$OBSIDIAN_DAILY_NOTES_PATH/$(date +%Y-%m-%d).md\" 2>/dev/null | tail -r'",
]
ansi = true
output = "{strip_ansi|split:\\::..2}"

[preview]
command = "bat -n --color=always --highlight-line '{strip_ansi|split:\\::1}' '{strip_ansi|split:\\::0}'"
env = { BAT_THEME = "ansi" }
offset = "{strip_ansi|split:\\::1}"

[ui]
preview_panel = { header = "{strip_ansi|split:\\::..2}" }

[keybindings]
enter = "actions:mark_done"
ctrl-s = "cycle_sources"
f1 = "actions:edit"
f2 = "actions:mark_pending"
f3 = "actions:mark_cancelled"
f4 = "actions:mark_forwarded"
f5 = "actions:mark_question"
f6 = "actions:mark_important"
f7 = "actions:add_todo"
f8 = "actions:add_daily"
f9 = "actions:delete"

[actions.mark_done]
description = "Mark as done [x]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [x]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.edit]
description = "Open in editor at line"
command = "sh -c '${EDITOR:-vim} \"+$2\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "execute"

[actions.mark_pending]
description = "Mark as in-progress [/]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [\\/]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.mark_cancelled]
description = "Mark as cancelled [-]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [-]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.mark_forwarded]
description = "Mark as forwarded [>]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [>]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.mark_question]
description = "Mark as question [?]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [?]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.mark_important]
description = "Mark as important [!]"
command = "sh -c 'sed -i \"\" \"$2s/- \\[.\\]/- [!]/\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"

[actions.add_todo]
description = "Add new todo to todos.md"
command = "sh -c 'todo=$(echo \"\" | fzf --print-query --header=\"New Todo:\" --height=3 | head -1); [ -n \"$todo\" ] && echo \"- [ ] $todo\" >> \"$OBSIDIAN_TODOS_FILE\"'"
mode = "fork"

[actions.add_daily]
description = "Add new todo to today's daily note Tasks section"
command = "sh -c 'FILE=\"$OBSIDIAN_DAILY_NOTES_PATH/$(date +%Y-%m-%d).md\"; [ ! -f \"$FILE\" ] && printf \"# %s\\n\\n## Tasks\\n\" \"$(date +%Y-%m-%d)\" > \"$FILE\"; grep -q \"^## Tasks\" \"$FILE\" || printf \"\\n## Tasks\\n\" >> \"$FILE\"; todo=$(echo \"\" | fzf --print-query --header=\"Daily Todo:\" --height=3 | head -1); [ -n \"$todo\" ] && perl -i -0777 -pe \"BEGIN { \\$t = shift } s/(## Tasks(?:(?!^#).)*?)\\n(\\s*(?=#|\\z))/\\$1\\n- [ ] \\$t\\n\\$2/ms\" \"$todo\" \"$FILE\"'"
mode = "fork"

[actions.delete]
description = "Delete the selected todo line"
command = "sh -c 'sed -i \"\" \"$2d\" \"$1\"' -- '{strip_ansi|split:\\::0}' '{strip_ansi|split:\\::1}'"
mode = "fork"
