# Television Configuration File
# ============================================================================
# This file configures GLOBAL settings for television.
# For CHANNEL-SPECIFIC settings (including keybindings), edit files in:
#   ~/.config/television/cable/*.toml
#
# See examples: files.toml, env.toml, etc.

[ui]
# Whether to use nerd font icons in the UI
# Requires a Nerd Font patched font (https://www.nerdfonts.com/)
use_nerd_font_icons = true

# How much space to allocate for the UI (percentage of screen: 1-100)
ui_scale = 100

# Show the top help bar by default (toggle with ctrl-g)
show_help_bar = true

# Input bar position: "top" or "bottom"
input_bar_position = "bottom"

# UI theme to use
# Available themes in ~/.config/television/themes/:
#   catppuccin, dracula, gruvbox-dark, gruvbox-light, monokai,
#   nord-dark, onedark, solarized-dark, solarized-light, tokyonight
theme = "catppuccin"

# Previewers settings
# ----------------------------------------------------------------------------
[previewers.file]
# Syntax highlighting theme (uses bat engine)
# List available themes: bat --list-themes
theme = "Coldark-Dark"
