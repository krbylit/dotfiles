windowrule = float true,match:class ^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk
windowrule = float true,match:class ^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
windowrule = float true,match:class ^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
windowrule = float true,match:class ^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk

# workaround for jetbrains IDEs dropdowns/popups cause flickering
windowrule = no_initial_focus true,match:class ^(.*jetbrains.*)$,match:title ^(win[0-9]+)$

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur true,match:namespace rofi
layerrule = ignore_alpha 0,match:namespace rofi
layerrule = blur true,match:namespace notifications
layerrule = ignore_alpha 0,match:namespace notifications
layerrule = blur true,match:namespace swaync-notification-window
layerrule = ignore_alpha 0,match:namespace swaync-notification-window
layerrule = blur true,match:namespace swaync-control-center
layerrule = ignore_alpha 0,match:namespace swaync-control-center
layerrule = blur true,match:namespace logout_dialog

# ── APP-TO-WORKSPACE RULES (ported from macOS yabai) ────────────
# Workspace assignments: term(1) browser(2) code(3) dev(4) misc(5) comms(6) ref(7) debug(8) util(9)

# term (workspace 1) — terminal emulators
windowrule = workspace 1, match:class ^(com\.mitchellh\.ghostty)$
windowrule = workspace 1, match:class ^(ghostty)$
windowrule = workspace 1, match:class ^(kitty)$

# browser (workspace 2) — web browsers
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(microsoft-edge)$
windowrule = workspace 2, match:class ^(brave-browser)$
windowrule = workspace 2, match:class ^(chromium)$

# code (workspace 3) — code editors
windowrule = workspace 3, match:class ^([Cc]ode)$
windowrule = workspace 3, match:class ^(code-oss)$
windowrule = workspace 3, match:class ^(cursor)$
windowrule = workspace 3, match:class ^(sublime_text)$
windowrule = workspace 3, match:class ^(.*jetbrains.*)$

# dev (workspace 4) — dev tools
windowrule = workspace 4, match:class ^(postman)$
windowrule = workspace 4, match:class ^(org\.wireshark\..*)$
windowrule = workspace 4, match:class ^(com\.mongodb\.compass)$
windowrule = workspace 4, match:class ^(docker-desktop)$
windowrule = workspace 4, match:class ^(GitHub Desktop)$
windowrule = workspace 4, match:class ^(org\.gnome\.Nautilus)$

# misc (workspace 5) — file manager, misc
windowrule = workspace 5, match:class ^(org\.kde\.dolphin)$
windowrule = workspace 5, match:class ^(thunar)$

# comms (workspace 6) — communication
windowrule = workspace 6, match:class ^(Slack)$
windowrule = workspace 6, match:class ^(zoom)$
windowrule = workspace 6, match:class ^(thunderbird)$
windowrule = workspace 6, match:class ^(org\.gnome\.Evolution)$
windowrule = workspace 6, match:class ^(discord)$
windowrule = workspace 6, match:class ^(vesktop)$

# ref (workspace 7) — reference/notes
windowrule = workspace 7, match:class ^(obsidian)$
windowrule = workspace 7, match:class ^(notion-app)$
windowrule = workspace 7, match:class ^(notion-calendar)$
windowrule = workspace 7, match:class ^(io\.lmstudio\.app)$

# debug (workspace 8) — AI/debug browsers
windowrule = workspace 8, match:class ^(google-chrome)$
windowrule = workspace 8, match:class ^(Claude)$
windowrule = workspace 8, match:class ^(ChatGPT)$

# util (workspace 9) — utilities
windowrule = workspace 9, match:class ^(1[Pp]assword)$
windowrule = workspace 9, match:class ^(org\.kde\.kalk)$
windowrule = workspace 9, match:class ^(gnome-calculator)$
windowrule = workspace 9, match:class ^(figma-linux)$

# Unmanaged/floating apps (ported from yabai unmanaged list)
windowrule = float true, match:class ^(gnome-calculator)$
windowrule = float true, match:class ^(org\.kde\.kalk)$
windowrule = float true, match:class ^(pavucontrol)$
windowrule = float true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(1[Pp]assword)$
windowrule = float true, match:title ^(Quick Access)(.*)$

# hyprlang endif