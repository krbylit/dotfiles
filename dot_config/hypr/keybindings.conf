## █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ █ █░▀█ █▄█ ▄█

# see https://wiki.hyprland.org/configuring/keywords/ for more
# see https://wiki.hyprland.org/configuring/binds/ for more

#? ------- MODIFIER PHILOSOPHY ----------------
# This config mirrors the macOS skhd/Karabiner setup:
#   Alt       = Window management (focus, move, workspace, layout)
#   Ctrl+Alt  = Window focus (vim-style hjkl)
#   Shift+Alt = Window move/manipulate
#   Super     = App launching & HyDE utilities
#   Ctrl+Ret  = Terminal (matching skhd)
#
# Original HyDE defaults used $mainMod (Super) for everything.
# HyDE default for each binding is noted in comments for reference.

#? ------- Variables ----------------
$TERMINAL = ghostty

$wm=Window Management
$d=[$wm]

# ── WINDOW MANAGEMENT (Alt-based, matching skhd) ──────────────────

# Close window (HyDE default: Super+Q)
bindd = Alt, Q, $d close focused window, exec, hyde-shell dontkillsteam
bindd = Alt, F4, $d close focused window, exec, hyde-shell dontkillsteam

# Toggle floating (HyDE default: Super+W → now Shift+Alt+T matching skhd)
bindd = Shift Alt, T, $d toggle floating, togglefloating

# Toggle group (HyDE default: Super+G)
bindd = Alt, G, $d toggle group, togglegroup

# Toggle fullscreen (HyDE default: Shift+F11)
bindd = Shift, F11, $d toggle fullscreen, fullscreen

# Toggle pin (HyDE default: Super+Shift+F)
bindd = Super Shift, F, $d toggle pin on focused window, exec, hyde-shell windowpin

# Kill session (HyDE default: Super+Delete)
bindd = Alt, Delete, $d kill hyprland session, exec, hyde-shell logout

# Lock screen (HyDE default: Super+L → keep on Super, not WM action)
bindd = Super, L, $d lock screen, exec, hyde-shell lock-session

# Logout menu (HyDE default: Ctrl+Alt+Delete)
bindd = Control Alt, Delete, $d logout menu, exec, hyde-shell logoutlaunch

# Toggle waybar (HyDE default: Alt_R+Ctrl_R)
bindd = Alt_R, Control_R, $d toggle waybar and reload config, exec, hyde-shell waybar --hide

$d=[$wm|Group Navigation]
# HyDE default: Super+Ctrl+H/L
bindd = Alt Control, H, $d change active group backwards, changegroupactive, b
bindd = Alt Control, L, $d change active group forwards, changegroupactive, f

# ── WINDOW FOCUS (Ctrl+Alt+hjkl, matching skhd) ──────────────────

$d=[$wm|Change focus]
# skhd: ctrl+alt+hjkl → focus window (vim-style)
# HyDE default: Super+Arrow
bindd = Control Alt, H, $d focus left, movefocus, l
bindd = Control Alt, L, $d focus right, movefocus, r
bindd = Control Alt, K, $d focus up, movefocus, u
bindd = Control Alt, J, $d focus down, movefocus, d
bindd = Control Alt, P, $d focus recent, focuswindow, recent
# Also keep arrow key variants
bindd = Alt, Left, $d focus left, movefocus, l
bindd = Alt, Right, $d focus right, movefocus, r
bindd = Alt, Up, $d focus up, movefocus, u
bindd = Alt, Down, $d focus down, movefocus, d
# Alt+Tab cycle (HyDE default: Alt+Tab — already matches)
bindd = Alt, Tab, $d cycle focus, cyclenext

# ── WINDOW RESIZE (Shift+Alt+Arrow, matching HyDE pattern) ───────

$d=[$wm|Resize Active Window]
# HyDE default: Super+Shift+Arrow
bindde = Shift Alt, Right, $d resize window right, resizeactive, 30 0
bindde = Shift Alt, Left, $d resize window left, resizeactive, -30 0
bindde = Shift Alt, Up, $d resize window up, resizeactive, 0 -30
bindde = Shift Alt, Down, $d resize window down, resizeactive, 0 30

# ── WINDOW MOVE (Shift+Alt+hjkl, matching skhd warp) ─────────────

$d=[$wm|Move active window across workspace]
# skhd: shift+alt+hjkl → warp window
# HyDE default: Super+Shift+Ctrl+Arrow
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = Shift Alt Control, left, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = Shift Alt Control, right, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = Shift Alt Control, up, Move active window up, exec, $moveactivewindow 0 -30 || hyprctl dispatch movewindow u
bindde = Shift Alt Control, down, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Vim-style window warp (skhd: shift+alt+hjkl)
bindd = Shift Alt, H, $d warp window left, movewindow, l
bindd = Shift Alt, J, $d warp window down, movewindow, d
bindd = Shift Alt, K, $d warp window up, movewindow, u
bindd = Shift Alt, L, $d warp window right, movewindow, r

# Move/Resize focused window with mouse
$d=[$wm|Move & Resize with mouse]
# HyDE default: Super+mouse — keep on Alt to match skhd (alt+drag)
binddm = Alt, mouse:272, $d hold to move window, movewindow
binddm = Alt, mouse:273, $d hold to resize window, resizewindow
binddm = Alt, Z, $d hold to move window, movewindow
binddm = Alt, X, $d hold to resize window, resizewindow

# Toggle split (HyDE default: Super+J)
$d=[$wm]
bindd = Alt Shift, X, $d toggle split, togglesplit

# ── DISPLAY FOCUS & MOVE (matching skhd) ─────────────────────────

$d=[$wm|Display]
# skhd: alt+w/e → focus display west/east
bindd = Alt, W, $d focus display west, focusmonitor, l
bindd = Alt, E, $d focus display east, focusmonitor, r
# skhd: shift+alt+w/e → move window to display
bindd = Shift Alt, W, $d move window to display west, movewindow, mon:l
bindd = Shift Alt, E, $d move window to display east, movewindow, mon:r

# ── LAYOUT SWITCHING (matching skhd) ─────────────────────────────

$d=[$wm|Layout]
# skhd: alt+t → toggle stack/bsp
bindd = Alt, T, $d toggle group (stack/tiled), togglegroup
# skhd: alt+s → stack layout
bindd = Alt, S, $d toggle split, togglesplit
# skhd: alt+b → bsp layout (no direct equivalent — use dwindle pseudo)
# bindd = Alt, B, $d toggle pseudo, pseudo
# skhd: alt+f → float (intercepted by Karabiner on macOS, so free here)
bindd = Alt, F, $d toggle floating, togglefloating
# skhd: shift+alt+r → rotate
bindd = Shift Alt, R, $d rotate layout, exec, hyprctl dispatch layoutmsg "orientationnext"
# skhd: shift+alt+y → mirror y-axis
bindd = Shift Alt, Y, $d swap with next, swapnext
# skhd: shift+alt+e → balance
bindd = Shift Alt, space, $d balance windows, exec, hyprctl dispatch layoutmsg "mfact 0"
# skhd: shift+alt+m → maximize/fullscreen
bindd = Shift Alt, M, $d toggle maximize, fullscreen, 1
# skhd: shift+alt+f → native fullscreen
bindd = Shift Alt, F, $d toggle native fullscreen, fullscreen, 0

# Show desktop — focus empty workspace (skhd: alt+d)
bindd = Alt, D, $d show desktop, workspace, empty

# ── APP LAUNCHING (Super-based, HyDE utilities) ──────────────────

$l=Launcher
$d=[$l|Apps]
# Terminal: Ctrl+Return (matching skhd) + Super+T as alias
bindd = Control, Return, $d terminal emulator, exec, $TERMINAL
bindd = Super, T, $d terminal emulator, exec, $TERMINAL
bindd = Super Alt, T, $d dropdown terminal, exec, hyde-shell pypr toggle console
bindd = Super, E, $d file explorer, exec, $EXPLORER
bindd = Super, C, $d text editor, exec, $EDITOR
bindd = Super, B, $d web browser, exec, $BROWSER
bindd = Control Shift, Escape, $d system monitor, exec, hyde-shell system.monitor

# Quick-launch commands (ported from Raycast script commands)
bindd = Super Shift, B, $d btop system monitor, exec, ghostty -e btop
bindd = Super Shift, M, $d youtube music TUI, exec, ghostty -e fish -c ytm

$d=[$l|Rofi menus]
$rofi-launch=hyde-shell rofilaunch
# HyDE default: Super+A (app launcher) — keeping
bindd = Super, A, $d application finder, exec, pkill -x rofi || $rofi-launch d
bindd = Super, TAB, $d window switcher, exec, pkill -x rofi || $rofi-launch w
bindd = Super Shift, E, $d file finder, exec, pkill -x rofi || $rofi-launch f
bindd = Super, slash, $d keybindings hint, exec, pkill -x rofi || hyde-shell keybinds_hint c
bindd = Super, comma, $d emoji picker, exec, pkill -x rofi || hyde-shell emoji-picker
bindd = Super, period, $d glyph picker, exec, pkill -x rofi || hyde-shell glyph-picker
bindd = Super, V, $d clipboard, exec, pkill -x rofi || hyde-shell cliphist -c
bindd = Super Shift, V, $d clipboard manager, exec, pkill -x rofi || hyde-shell cliphist
bindd = Super Shift, A, $d select rofi launcher, exec, pkill -x rofi || hyde-shell rofiselect

# ── HARDWARE CONTROLS ────────────────────────────────────────────

$hc=Hardware Controls
$d=[$hc|Audio]
binddl  = , F10, $d toggle mute output, exec, hyde-shell volumecontrol -o m
binddl  = , XF86AudioMute, $d toggle mute output, exec, hyde-shell volumecontrol -o m
binddel = , F11, $d decrease volume, exec, hyde-shell volumecontrol -o d
binddel = , F12, $d increase volume, exec, hyde-shell volumecontrol -o i
binddl  = , XF86AudioMicMute, $d un/mute microphone, exec, hyde-shell volumecontrol -i m
binddel = , XF86AudioLowerVolume, $d decrease volume, exec, hyde-shell volumecontrol -o d
binddel = , XF86AudioRaiseVolume, $d increase volume, exec, hyde-shell volumecontrol -o i

$d=[$hc|Media]
binddl  = , XF86AudioPlay, $d play media, exec, playerctl play-pause
binddl  = , XF86AudioPause, $d pause media, exec, playerctl play-pause
binddl  = , XF86AudioNext, $d next media, exec, playerctl next
binddl  = , XF86AudioPrev, $d previous media, exec, playerctl previous

$d=[$hc|Brightness]
binddel = , XF86MonBrightnessUp, $d increase brightness, exec, hyde-shell brightnesscontrol i
binddel = , XF86MonBrightnessDown, $d decrease brightness, exec, hyde-shell brightnesscontrol d
bindl = , switch:on:Lid Switch, exec, $HOME/.local/bin/hypr-clamshell-sync
bindl = , switch:off:Lid Switch, exec, $HOME/.local/bin/hypr-clamshell-sync

# ── UTILITIES ────────────────────────────────────────────────────

$ut=Utilities
$d=[$ut]
binddl = Super, K, $d toggle keyboard layout, exec, hyde-shell keyboardswitch
bindd = Super Alt, G, $d game mode, exec, hyde-shell gamemode
bindd = Super Shift, G, $d open game launcher, exec, hyde-shell gamelauncher

$d=[$ut|Screen Capture]
# HyDE default: Super+P (screenshot) — keeping on Super
bindd = Super Shift, P, $d color picker, exec, hyprpicker -an
bindd = Super, P, $d snip screen, exec, hyde-shell screenshot s
bindd = Super Control, P, $d freeze and snip screen, exec, hyde-shell screenshot sf
binddl = Super Alt, P, $d print monitor, exec, hyde-shell screenshot m
binddl = , Print, $d print all monitors, exec, hyde-shell screenshot p

# ── THEMING & WALLPAPER (Super-based) ────────────────────────────

$rice=Theming and Wallpaper
$d=[$rice]
bindd = Super Alt, Right, $d next global wallpaper, exec, hyde-shell wallpaper -Gn
bindd = Super Alt, Left, $d previous global wallpaper, exec, hyde-shell wallpaper -Gp
bindd = Super Shift, W, $d select a global wallpaper, exec, pkill -x rofi || hyde-shell wallpaper -SG
bindd = Super Alt, Up, $d next waybar layout, exec, hyde-shell wbarconfgen n
bindd = Super Alt, Down, $d previous waybar layout, exec, hyde-shell wbarconfgen p
bindd = Super Shift, R, $d wallbash mode selector, exec, pkill -x rofi || hyde-shell wallbashtoggle -m
bindd = Super Shift, T, $d select a theme, exec, pkill -x rofi || hyde-shell themeselect
bindd = Super+Shift, Y, $d select animations, exec, pkill -x rofi || hyde-shell animations --select
bindd = Super+Shift, U, $d select hyprlock layout, exec, pkill -x rofi || hyde-shell hyprlock --select

# ── WORKSPACES (Alt-based, matching skhd) ────────────────────────

$ws=Workspaces
$d=[$ws|Navigation]
# skhd: alt+1-0 → focus workspace (EXACT MATCH)
bindd = Alt, 1, $d navigate to workspace 1, workspace, 1
bindd = Alt, 2, $d navigate to workspace 2, workspace, 2
bindd = Alt, 3, $d navigate to workspace 3, workspace, 3
bindd = Alt, 4, $d navigate to workspace 4, workspace, 4
bindd = Alt, 5, $d navigate to workspace 5, workspace, 5
bindd = Alt, 6, $d navigate to workspace 6, workspace, 6
bindd = Alt, 7, $d navigate to workspace 7, workspace, 7
bindd = Alt, 8, $d navigate to workspace 8, workspace, 8
bindd = Alt, 9, $d navigate to workspace 9, workspace, 9
bindd = Alt, 0, $d navigate to workspace 10, workspace, 10

$d=[$ws|Navigation|Relative workspace]
# HyDE default: Super+Ctrl+Right/Left
bindd = Alt Control, Right, $d change active workspace forwards, workspace, r+1
bindd = Alt Control, Left, $d change active workspace backwards, workspace, r-1

$d=[$ws|Navigation]
bindd = Alt Control, Down, $d navigate to nearest empty workspace, workspace, empty

# Move focused window to a workspace
$d=[$ws|Move window to workspace]
# skhd: shift+alt+1-0 → move window to workspace (EXACT MATCH)
bindd = Shift Alt, 1, $d move to workspace 1, movetoworkspace, 1
bindd = Shift Alt, 2, $d move to workspace 2, movetoworkspace, 2
bindd = Shift Alt, 3, $d move to workspace 3, movetoworkspace, 3
bindd = Shift Alt, 4, $d move to workspace 4, movetoworkspace, 4
bindd = Shift Alt, 5, $d move to workspace 5, movetoworkspace, 5
bindd = Shift Alt, 6, $d move to workspace 6, movetoworkspace, 6
bindd = Shift Alt, 7, $d move to workspace 7, movetoworkspace, 7
bindd = Shift Alt, 8, $d move to workspace 8, movetoworkspace, 8
bindd = Shift Alt, 9, $d move to workspace 9, movetoworkspace, 9
bindd = Shift Alt, 0, $d move to workspace 10, movetoworkspace, 10

# Move to relative workspace (skhd: shift+alt+p/n)
$d=[$ws]
bindd = Shift Alt, N, $d move window to next workspace, movetoworkspace, r+1
bindd = Shift Alt, P, $d move window to previous workspace, movetoworkspace, r-1

# Scroll through workspaces with mouse
$d=[$ws|Navigation]
bindd = Alt, mouse_down, $d next workspace, workspace, e+1
bindd = Alt, mouse_up, $d previous workspace, workspace, e-1

# Scratchpad (HyDE default: Super+S/Super+Shift+S)
$d=[$ws|Navigation|Special workspace]
bindd = Super Shift, S, $d move to scratchpad, movetoworkspace, special
bindd = Super Alt, S, $d move to scratchpad (silent), movetoworkspacesilent, special
bindd = Super, S, $d toggle scratchpad, togglespecialworkspace

# Move to workspace silently (HyDE default: Super+Alt+1-0)
$d=[$ws|Navigation|Move window silently]
bindd = Super Alt, 1, $d move to workspace 1 (silent), movetoworkspacesilent, 1
bindd = Super Alt, 2, $d move to workspace 2 (silent), movetoworkspacesilent, 2
bindd = Super Alt, 3, $d move to workspace 3 (silent), movetoworkspacesilent, 3
bindd = Super Alt, 4, $d move to workspace 4 (silent), movetoworkspacesilent, 4
bindd = Super Alt, 5, $d move to workspace 5 (silent), movetoworkspacesilent, 5
bindd = Super Alt, 6, $d move to workspace 6 (silent), movetoworkspacesilent, 6
bindd = Super Alt, 7, $d move to workspace 7 (silent), movetoworkspacesilent, 7
bindd = Super Alt, 8, $d move to workspace 8 (silent), movetoworkspacesilent, 8
bindd = Super Alt, 9, $d move to workspace 9 (silent), movetoworkspacesilent, 9
bindd = Super Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

# Delete focused workspace (skhd: shift+alt+q)
bindd = Shift Alt, Q, $d destroy focused workspace, exec, hyprctl dispatch workspace empty && hyprctl dispatch closewindow

$d=#! unset the group name

#? ------- HyDE DEFAULT REFERENCE ----------------
# Original HyDE defaults before Alt-based remap (for reverting):
#   $mainMod = Super
#   Super+Q        = close window         → Alt+Q
#   Super+W        = toggle floating      → Shift+Alt+T
#   Super+G        = toggle group         → Alt+G
#   Super+J        = toggle split         → Alt+Shift+X
#   Super+T        = terminal             → Ctrl+Return / Super+T
#   Super+E        = file explorer        → Super+E (kept)
#   Super+C        = text editor          → Super+C (kept)
#   Super+B        = browser              → Super+B (kept)
#   Super+A        = rofi launcher        → Super+A (kept)
#   Super+L        = lock screen          → Super+L (kept)
#   Super+Arrow    = focus window         → Ctrl+Alt+HJKL / Alt+Arrow
#   Super+1-0      = workspace            → Alt+1-0
#   Super+Shift+1-0= move to workspace   → Shift+Alt+1-0
#   Super+P        = screenshot           → Super+P (kept)
#   Super+V        = clipboard            → Super+V (kept)
#   Super+S        = scratchpad           → Super+S (kept)
