# yazi-rs/schemas/theme.json defines the JSON schema for editor LSPs.
# Yazi 26.x rejects a top-level `"$schema"` key as not-kebab-case, so the
# editor-hint declaration is omitted here.

# vim:fileencoding=utf-8:foldmethod=marker

# : Flavor {{{
[flavor]
# dark = "tokyo-night"
# # NOTE: tokyonight tabs are very difficult to read unless colored manually
# [tabs]
# active = { fg = "#2E3440", bg = "#8FBCBB", bold = true } # nord0 on nord7 (Teal/Mint)
# inactive = { fg = "#8FBCBB", bg = "#3B4252" }            # nord7 on nord1

# dark = "onedark"
dark = "nord"
# dark = "kanagawa"
# dark = "vscode-dark-plus"
# dark = "rose-pine"
# dark = "catppuccin-macchiato"
# light = "catppuccin-latte"

[mgr]
# FIXME: doesn't seem to be making any effect
# syntect_theme = "./flavors/catppuccin-macchiato.yazi/tmtheme.xml"
# syntect_theme = "flavors/vscode-dark-modern.yazi/tmtheme.xml"


# : }}}

# : Icons {{{
[icon]
# Give `.env.local`, `.env.prod`, … the same icon yazi shows for bare `.env`.
# Icon globs match on `url` (a path glob) and are evaluated BEFORE the exact
# `files` rules, so `**/.env.*` catches the suffixed variants while bare `.env`
# keeps its builtin files-rule. `.envrc`/`.envrc.*` are untouched (no dot after
# `env`). Glyph + fg copied verbatim from yazi's default `.env` rule (U+F462).
prepend_globs = [
	{ url = "**/.env.*", text = "", fg = "#faf743" },
]

# : }}}
