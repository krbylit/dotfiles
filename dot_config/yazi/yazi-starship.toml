# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

format = '''$directory( $git_branch)( $git_status)( $git_state)( $terraform)( $nodejs)( $python)'''
# format = '$all'
add_newline = false

palette = "catp"
[palettes.catp]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
dark_red = "#e64553"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
green2 = "#a6d189"
dark_green = "#40a02b"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"

[directory]
read_only = '🔒'
read_only_style = 'red'
home_symbol = '~'
truncation_length = 0
before_repo_root_style = "#37c8b0"
truncate_to_repo = false
style = "#94e2d5"
repo_root_style = "bold #94e2d5"
repo_root_format = "[󰝰 $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)( [$read_only]($read_only_style))"
format = "[󰝰 $path]($style)( [$read_only]($read_only_style))"

[git_branch]
symbol = ""
style = "bold maroon"
format = '([$symbol $branch]($style))'

[git_status]
format = '([\[$conflicted$deleted$renamed$modified$typechanged$staged$untracked$ahead_behind\]]($style))'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\)'
style = 'bold yellow'

[nodejs]
style = 'bold green2'
symbol = ''
format = '[$symbol ($version)]($style)($engines_version)(not_capable_style)'

[python]
style = "bold pink"
symbol = ''
format = '[$symbol $pyenv_prefix($version)(  $virtualenv)]($style)'

[terraform]
disabled = false
symbol = ''                            #    
format = '[$symbol $workspace]($style)'
style = 'bold 105'                      # default
