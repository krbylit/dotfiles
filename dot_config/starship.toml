[custom.block_rprompt_repo_top]
when = true
require_repo = true
# format = "[┓](bold surface1)"
format = "[┐](bold surface1)"

[custom.block_rprompt_repo_bottom]
when = true
require_repo = true
# format = "[┛](bold surface1)"
format = "[┘](bold surface1)"

[custom.yazi_indicator]
when = '[ -n "$IS_YAZI_SUBSHELL" ]'
# 󰕗  󰳁       
format = '[]($style)' # or any icon/text you prefer
style = 'bold yellow'

# ================ Transient prompts ================
# Angular LEFT
[custom.angular_transient_prompt]
# command = 'starship module custom.transient_lprompt; starship module directory; echo -n " "; starship module git_branch; echo ""; echo -n "     "; echo -n "┗ "; starship module character; starship module custom.time'
command = 'starship module custom.transient_lprompt; starship module directory; echo -n " "; starship module git_branch; echo ""; starship module custom.transient_lprompt; starship module custom.transient_lprompt_angle; starship module character; starship module custom.time'
style = 'bold comment'
when = true
format = "[$output]($style) $symbol "
symbol = "[](green)"

[custom.transient_lprompt_angle]
command = "echo -n '└ '"
style = 'bold comment'
when = true
format = "[$output]($style) "

# ▓▒░
# ░▒▓
[custom.transient_lprompt]
command = "echo -n '░▒▓'"
style = 'yellow'
when = true
format = "[$output]($style) "

# ░▒▓█
# █▓▒░
# RIGHT
[custom.transient_rprompt]
command = "echo -n '█▓▒░'"
style = 'yellow'
when = true
format = " [$output]($style)"

[fill]
# symbol = '━'            # For Block Prompt
symbol = '─'           # For Block Prompt
style = 'bold comment'

[character]
# success_symbol = "[](bold dark_green)"
# vimcmd_symbol = "[](bold green2)"
# vimcmd_visual_symbol = "[](bold lavendar)"
# vimcmd_replace_symbol = "[](bold red)"
# vimcmd_replace_one_symbol = "[](bold red)"
# error_symbol = "[](bold dark_red)"
success_symbol = "[](bold green)"
vimcmd_symbol = "[](bold blue)"
vimcmd_visual_symbol = "[](bold magenta)"
vimcmd_replace_symbol = "[](bold red)"
vimcmd_replace_one_symbol = "[](bold red)"
# error_symbol = "[](bold red)"
error_symbol = "[╳](bold red)"
# ╳ ε Δ

[username]
disabled = false
style_user = "bold blue dimmed"
style_root = "bold red"
show_always = true
format = '[ $user]($style)'

[custom.hostname]
command = "sh -c '[ -n \"$CUSTOM_HOSTNAME\" ] && echo \"$CUSTOM_HOSTNAME\" || hostname'"
when = true
style = 'bold orange dimmed'
format = '[ $output]($style)'

[hostname]
ssh_only = false
ssh_symbol = ''
style = 'bold orange dimmed'
format = '[($ssh_symbol ) $hostname]($style)'

[directory]
read_only = ''
read_only_style = 'red'
home_symbol = '~'
truncation_length = 0
before_repo_root_style = "flamingo dimmed"
truncate_to_repo = false
style = "peach"
repo_root_style = "bold magenta"
repo_root_format = "[]($style) [$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)( [$read_only]($read_only_style))"
format = "[ $path]($style)( [$read_only]($read_only_style))"

[git_branch]
symbol = ""
style = "bold maroon"
format = '([$symbol $branch]($style))'

[git_state]
disabled = true
format = '\([$state( $progress_current/$progress_total)]($style)\)'
style = 'bold yellow'

[git_status]
disabled = true
format = '([\[$conflicted$deleted$renamed$modified$typechanged$staged$untracked$ahead_behind\]]($style))'

[sudo]
disabled = false
format = '[$symbol]($style)'
symbol = ''
style = 'bold blue'

[status]
disabled = false
style = 'yellow'
format = '[\[$status - $common_meaning\]]($style)'

[nodejs]
style = 'bold green1'
not_capable_style = 'bold red'
symbol = ''
format = '[$symbol ($version)]($style)[(  ($engines_version))](not_capable_style)'

[python]
style = "bold pink"
symbol = ''
format = '[$symbol $pyenv_prefix($version)(  $virtualenv)]($style)'

#    
[rust]
symbol = ''
# versions available 'raw', 'major', 'minor', 'patch'
version_format = 'v${raw}'
style = 'bold orange'
format = '[$symbol $version]($style)'

[container]
disabled = true
symbol = ''
style = 'bold red dimmed'
format = '[$symbol \[$name\]]($style)'

[cmd_duration]
disabled = false
min_time = 0
show_milliseconds = true
style = "green1 dimmed"
format = "[ $duration]($style)"

[terraform]
disabled = false
symbol = ''                            #    
format = '[$symbol $workspace]($style)'
style = 'bold 105'                      # default

[time]
disabled = false
style = "bold yellow dimmed"
format = "[ $time]($style)"
time_format = "%Y-%m-%d | %H:%M"
utc_time_offset = "local"
use_12hr = false

# Used in our transient prompt
[custom.time]
command = "date +'%H:%M:%S'"
style = "yellow dimmed"
format = "[ $output]($style)"
when = true
# style = "inverted"
# Old icons 
# format = "[{  $output }]($style)"
