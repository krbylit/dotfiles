# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Icons
#   
#            

# Set for git timeout error received in chezmoi dir (though may be due to using tethered connection)
command_timeout = 5000

# █▓▒
# ▓▒░
#
# ░▒▓
# ▒▓█

# ================ Prompts ================
# Constant right-side design
# Light box border
# ┚ ┒ ┐ ┘ ┌ └ ↵ ❰ ❮ ✦ ✧ ◊ ◁ ◄ ╮ ╭ ╯ ╰ ▷▷
format = """
[░▒▓](teal) $directory $fill( $status)( $username ${custom.hostname})( $cmd_duration )[┐](bold comment)
[▒▓█](teal)( $terraform) (${custom.yazi_indicator} )$character($sudo )
"""
right_format = '''
($git_branch )($rust )($nodejs )($python )[┘](bold comment)
'''
# Bold box border
# format = """
# [█▓▒](flamingo) $directory $fill( $status)( $username ${custom.hostname})( $cmd_duration )[┓](bold surface1)
# [▓▒░](flamingo)( $terraform) (${custom.yazi_indicator} )$character($sudo )
# """
# right_format = '''
# ($git_branch )($rust )($nodejs )($python )[┛](bold surface1)
# '''
# # Repo-dependent right-side design
# format = """
# [█▓▒](flamingo) $directory $fill( $status)( $username ${custom.hostname})( $cmd_duration )${custom.block_rprompt_repo_top}
# [▓▒░](flamingo)( $terraform) (${custom.yazi_indicator} )$character($sudo )
# """
# right_format = '''
# (($git_branch )($nodejs )($python )[┛](bold surface1))
# '''
# continuation_prompt = ' '
continuation_prompt = '▷▷ '

add_newline = true

# palette = "catp"
palette = "tokyonight"

[palettes.tokyonight]
bg = "#24283b"
bg_dark = "#1f2335"
bg_dark1 = "#1b1e2d"
bg_highlight = "#292e42"
blue = "#7aa2f7"
blue0 = "#3d59a1"
blue1 = "#2ac3de"
blue2 = "#0db9d7"
blue5 = "#89ddff"
blue6 = "#b4f9f8"
blue7 = "#394b70"
comment = "#565f89"
cyan = "#7dcfff"
dark3 = "#545c7e"
dark5 = "#737aa2"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
fg_gutter = "#3b4261"
green = "#9ece6a"
green1 = "#73daca"
green2 = "#41a6b5"
magenta = "#bb9af7"
magenta2 = "#ff007c"
orange = "#ff9e64"
purple = "#9d7cd8"
red = "#f7768e"
red1 = "#db4b4b"
teal = "#1abc9c"
terminal_black = "#414868"
yellow = "#e0af68"
flamingo = "#f0c6c6"
peach = "#f5a97f"
maroon = "#ee99a0"
pink = "#f5bde6"

[palettes.catp]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
dark_red = "#e64553"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
green2 = "#a6d189"
dark_green = "#40a02b"
teal = "#8bd5ca"
teal2 = "#1abc9c"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
blue0 = "#3d59a1"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
